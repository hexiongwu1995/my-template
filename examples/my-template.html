<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN 引入测试</title>
    <!-- 通过 jsDelivr CDN 引入 -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@hexiongwu1995/my-template@latest/dist/iconfont/iconfont.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hexiongwu1995/my-template@latest/dist/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hexiongwu1995/my-template@latest/dist/css/math.css">
    <script src="https://cdn.jsdelivr.net/npm/@hexiongwu1995/my-template@latest/dist/script/mathjax.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@4/startup.js"></script>
</head>

<body>
    <div class="container">
        <aside>
            <nav></nav>
        </aside>
        <div class="overlay"></div>
        <main>
            <header>
                <span class="iconfont icon-bars"></span>
                <span class="iconfont pagetitle">
                    <script>document.write(document.querySelector('title').textContent)</script>
                </span>
                <span class="collection">
                    <span class="iconfont icon-Homehomepagemenu"></span>
                    <span class="iconfont icon-paintbrush"></span>
                    <span class="iconfont icon-printer-fill"></span>
                    <span class="iconfont icon-github"></span>
                </span>

            </header>
            <article>
            </article>
        </main>
    </div>

    <div class="hidden-content">

        <section>
            <!-- 数学公式的输入请参考这个section的格式。 -->
            <h1>模板</h1>
            <p>这是一个行内数学公式：<span class="math">`sum_(i=1)^n i^3=((n(n+1))/2)^2`</span> </p>
            <p>
                <span class="math-space">
                    <span class="text">这是一个块级数学公式：</span>
                    <span class="math">`sum_(i=1)^n i^3=((n(n+1))/2)^2`</span>
                    <span class="math-end">公式末尾内容</span>
                </span>
            </p>
            <p>下面是一个独立行块级公式：
            <div class="math">`sum_(i=1)^n i^3=((n(n+1))/2)^2`</div>
            </p>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@hexiongwu1995/my-template@latest/dist/script/script.js"></script>
</body>

</html>
